name: crypto-alert-bot
runtime: python
version: 3.11

build:
  commands:
    - pip install -r requirements.txt

start:
  command: python alert_coin.py

env:
  - CHECK_INTERVAL
  - RSI_PERIOD
  - RSI_OVERSOLD
  - RSI_OVERBOUGHT
  - MIN_VOLUME_USDT
  - CATEGORY
  - EXCLUDE_COINS
  - TELEGRAM_BOT_TOKEN
  - TELEGRAM_BOT_TOKEN_2
  - TELEGRAM_CHAT_ID
  - SINGLE_SCAN
  # alt_short 서비스용 (특정 주제로 알림 시)
  - TELEGRAM_BOT_TOKEN_ALT_SHORT
  - TELEGRAM_ALT_SHORT_CHAT_ID
  - TELEGRAM_ALT_SHORT_TOPIC_ID
